[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "myclaw"
version = "0.1.0"
description = "Local-first Personal Agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13,<4",
    "anthropic>=0.104,<0.117",
    "croniter>=6,<7",
    "ddgs>=9,<10",
    "jsonschema>=4.23,<5",
    "openai>=2.37,<3",
    "rich>=13.7,<15",
    "tomlkit>=0.13,<0.14",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
myclaw = "myclaw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
