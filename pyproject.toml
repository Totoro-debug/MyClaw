[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "myclaw"
version = "0.1.0"
description = "Host-neutral local-first Personal Agent runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.13,<4",
    "anthropic>=0.104,<0.117",
    "croniter>=6,<7",
    "ddgs>=9,<10",
    "loguru>=0.7.3,<0.8",
    "openai>=2.37,<3",
    "prompt-toolkit>=3.0.52,<4",
    "rich>=13.7,<15",
    "tomlkit>=0.13,<0.14",
    "typer>=0.12,<1",
    "tzdata>=2026.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.15.13",
]

[project.scripts]
myclaw = "myclaw.terminal.process_entry:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["myclaw*"]

[tool.setuptools.package-data]
"myclaw.templates" = ["*.md"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
files = ["myclaw", "tests"]
python_version = "3.12"
strict = true
